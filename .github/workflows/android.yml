name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: unzip deskclock_source.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Build
        run: |
          cd project
          ant debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deskclock
          path: project/bin/*.apk
